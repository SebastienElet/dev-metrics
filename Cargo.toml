[package]
name = "dev-metrics"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/SebastienElet/dev-metrics"
description = "CLI pour suivre ses métriques de développement"

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std", "serde"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "query", "rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tempfile = "=3.27.0"
toml = "=1.1.8"

[dev-dependencies]
jsonschema = { version = "=0.58.6", default-features = false }
mockito = "=1.7.2"
